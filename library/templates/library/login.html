{% extends 'library/base.html' %}

{% block title %}
    Iniciar sesión - Digital Library
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <header class="page-header">

            <h1>
                Iniciar sesión
            </h1>

        </header>

        <form method="post" class="auth-form">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Usuario
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

            </div>


            <button type="submit">
                Iniciar sesión
            </button>

        </form>

    </div>

</section>

{% endblock %}
